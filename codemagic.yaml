workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - DEFAULT
      xcode: latest
    scripts:
      - name: Set up signing
        script: |
          keychain initialize
          echo $CM_CERTIFICATE | base64 --decode > /tmp/cert.p12
          keychain add-certificates --certificate /tmp/cert.p12 --certificate-password $CM_CERTIFICATE_PASSWORD
          echo $CM_PROVISIONING_PROFILE | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
          xcode-project use-profiles
      - name: Build ipa
        script: |
          # Numéro de construction unique à chaque build (Apple refuse un numéro déjà envoyé).
          agvtool new-version -all $((BUILD_NUMBER + 10))
          xcode-project build-ipa \
            --project "Soleil En Terrasse.xcodeproj" \
            --scheme "Soleil En Terrasse"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      # Envoie le fichier .ipa sur App Store Connect avec la connexion « codemagic ».
      # La mise en vérification reste manuelle, sur appstoreconnect.apple.com.
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
